# use with: -Dspring.profiles.active=prod or set SPRING_PROFILES_ACTIVE=prod
server.port=8080
logging.level.root=INFO
# logging.file.name=/var/log/springapitemplate/app.log
# db
#spring.datasource.url=jdbc:postgresql://localhost:5432/mydb
#spring.datasource.username=${DB_USER:YOUR_DB_USER}
#spring.datasource.password=${DB_PASS:YOUR_DB_PASS}
spring.jpa.hibernate.ddl-auto=validate
server.compression.enabled=true
server.compression.mime-types=application/json,application/xml,text/html,text/xml,text/plain
server.compression.min-response-size=1024
# recommend securing management endpoints, cors, and csrf whatever as appropriate
# Timezone and JSON settings
spring.jackson.time-zone=UTC
spring.jackson.serialization.write-dates-as-timestamps=false