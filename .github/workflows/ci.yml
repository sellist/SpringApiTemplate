name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  build:
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        java-version: [ '19' ]

    steps:
    - uses: actions/checkout@v4
    
    - name: Set up JDK ${{ matrix.java-version }}
      uses: actions/setup-java@v4
      with:
        java-version: ${{ matrix.java-version }}
        distribution: 'temurin'
        cache: maven
    
    - name: Build with Maven
      run: mvn -q clean package
    
    - name: Run tests
      run: mvn -q test
    
    - name: Upload test results
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: test-reports
        path: target/surefire-reports/
    
    - name: Build Docker image (on main only)
      if: github.ref == 'refs/heads/main' && github.event_name == 'push'
      run: |
        docker build -t springapitemplate:${{ github.sha }} .
        docker tag springapitemplate:${{ github.sha }} springapitemplate:latest
    
    - name: SonarQube scan (optional - configure with sonar token)
      # Uncomment and add SONAR_TOKEN secret to enable
      # run: mvn -q clean verify -Dsonar.projectKey=SpringApiTemplate -Dsonar.host.url=${{ secrets.SONAR_HOST_URL }} -Dsonar.login=${{ secrets.SONAR_TOKEN }}
      run: echo "SonarQube scan disabled; configure SONAR_TOKEN to enable"
